name: Build QEMU (Windows x86_64)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build-qemu:
    runs-on: windows-latest
    
    steps:
      - name: Checkout QEMU staging branch
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: staging
          submodules: recursive # QEMU heavily relies on git submodules
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Condensed list of dependencies based on the PKGBUILD
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-sphinx
            mingw-w64-ucrt-x86_64-python-sphinx_rtd_theme
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-capstone
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-usbredir
            mingw-w64-ucrt-x86_64-spice
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-nettle

      - name: Configure QEMU
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          
          # Notes:
          # 1. --target-list=x86_64-softmmu restricts the build to x86_64 only, saving significant CI time.
          # 2. --disable-guest-agent circumvents the need for `widl` and the complex VSS provider steps seen in the PKGBUILD.
          # 3. --disable-werror prevents the build from failing on new warnings that often appear in the `staging` branch.
          ../configure \
            --prefix=/qemu-windows \
            --target-list=x86_64-softmmu \
            --enable-slirp \
            --enable-gtk \
            --enable-sdl \
            --enable-capstone \
            --disable-guest-agent \
            --disable-werror

      - name: Build QEMU
        shell: msys2 {0}
        run: |
          cd build
          make -j$(nproc)

      - name: Install QEMU to staging directory
        shell: msys2 {0}
        run: |
          cd build
          # Install to a local 'dist' folder so we can easily zip it
          make DESTDIR="$(pwd)/dist" install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-windows-x86_64
          # Path resolves to ./build/dist/qemu-windows inside the runner
          path: build/dist/qemu-windows/
