name: build-openwrt

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 额外软件包（空格分隔）
        default: kmod-inet-diag kmod-nft-queue podman fuse-overlayfs lxc-create lxc-templates lxc-destroy lxc-stop lxc-start lxc-autostart mount-utils lxc-execute ip-full curl procps-ng-ps procps-ng-free ss owut
      profile:
        description: 设备 PROFILE
        default: rpi-4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start tailcat
        run: |
          docker run -d --name tailcat ghcr.io/tailscale/tailcat --version
          docker cp tailcat:/usr/local/bin/tailcat .
          ./tailcat serve no-auth-ssh

      - name: Build image
        env:
          PROFILE: ${{ inputs.profile }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          mkdir -p bin
          docker run --rm --user root -v "$PWD/bin:/builder/bin" \
            ghcr.io/openwrt/imagebuilder:bcm27xx-bcm2711-25.12-SNAPSHOT \
            make image PROFILE="$PROFILE" PACKAGES="$PACKAGES"

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.profile }}
          path: bin/targets/bcm27xx/bcm2711/*
