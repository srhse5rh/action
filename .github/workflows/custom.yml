name: Debug Build Environment

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Runner OS (e.g., ubuntu-latest, macos-latest, windows-latest)'
        required: false
        default: 'ubuntu-latest'
        type: string
      ts_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...). CAUTION: Using inputs is less secure than secrets.'
        required: true # Make it required as it's essential for connection
        type: string


jobs:
  debug:
    runs-on: ${{ github.event.inputs.runner_os }}
    # timeout-minutes: 45

    steps:
      - uses: levibostian/action-hide-sensitive-inputs@v1
    
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Tailscale (Linux)
        
        if: runner.os == 'Linux'
        uses: tailscale/github-action@v3 
        with:
          authkey: ${{ inputs.ts_authkey }} 
          args: "--ssh"             

      - name: Install Tailscale (Windows)
        if: runner.os == 'Windows'
        run: choco install tailscale -y --no-progress --force

      - name: Start Tailscale (Windows)
        if: runner.os == 'Windows'
        run: '& "C:\Program Files\Tailscale\tailscale.exe" up --unattended --authkey=${{ inputs.ts_authkey }}'
        shell: pwsh 

      - name: Install Tailscale (macOS)
        if: runner.os == 'macOS'
        run: brew install tailscale
        

      - name: Start Tailscale (macOS)
        if: runner.os == 'macOS'
        run: sudo tailscale up --authkey=${{ inputs.TS_AUTHKEY }}
        


      - name: Keep runner alive (30 minutes)
        run: |
          echo "Runner is ready. Starting 30-minute wait loop."
          echo "Connect via Tailscale within 30 minutes."
          echo "Tailscale IP address(es):"
          
          if [ "$RUNNER_OS" == "Linux" ] || [ "$RUNNER_OS" == "macOS" ]; then
            tailscale ip -4 || echo "Could not get Tailscale IPv4"
            tailscale ip -6 || echo "Could not get Tailscale IPv6"
            echo "Process ID to potentially pause/kill: $$"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            & "C:\Program Files\Tailscale\tailscale.exe" ip -4 | Out-Host || Write-Host "Could not get Tailscale IPv4"
            & "C:\Program Files\Tailscale\tailscale.exe" ip -6 | Out-Host || Write-Host "Could not get Tailscale IPv6"
            Write-Host "Process ID to potentially pause/kill: $pid"
          fi
          echo "--------------------------------------------------"
          echo "To extend time: Connect via SSH/RDP and pause/kill the sleep process."
          echo "Example (Linux/macOS): Find PID above, then 'kill -STOP <PID>' to pause, 'kill -CONT <PID>' to resume, or 'kill <PID>' to end wait early."
          echo "Example (Windows): Find PID in Task Manager, suspend or terminate the 'sleep' or 'Start-Sleep' process."
          sleep 1800 
          echo "Wait finished or was interrupted."
        shell: bash 


      - name: Upload workspace directory
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.run_id }}
          path: .
