name: Debug Build Environment

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Runner OS (e.g., ubuntu-latest, macos-latest, windows-latest)'
        required: false
        default: 'ubuntu-latest'
        type: string
      ts_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...). CAUTION: Using inputs is less secure than secrets.'
        required: true # Make it required as it's essential for connection
        type: string


jobs:
  debug:
    runs-on: ${{ github.event.inputs.runner_os }}
    # timeout-minutes: 45

    steps:
      - uses: levibostian/action-hide-sensitive-inputs@v1
    
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Tailscale (Linux)
        
        if: runner.os == 'Linux'
        uses: tailscale/github-action@v3 
        with:
          authkey: ${{ inputs.ts_authkey }} 
          args: "--ssh"             

      - name: Install Tailscale (Windows)
        if: runner.os == 'Windows'
        run: choco install tailscale -y --no-progress --force

      - name: Start Tailscale (Windows)
        if: runner.os == 'Windows'
        run: '& "C:\Program Files\Tailscale\tailscale.exe" up --unattended --authkey=${{ inputs.ts_authkey }}'
        shell: pwsh 

      - name: Setup RDP (Windows)
        if: runner.os == 'Windows'
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "1234567890@Aa" -Force)

      - name: Install Tailscale (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tailscale
          sudo tailscaled install-system-daemon
        

      - name: Start Tailscale (macOS)
        if: runner.os == 'macOS'
        run: sudo tailscale up --authkey=${{ inputs.TS_AUTHKEY }} --ssh
        


      - name: Keep runner alive (30 minutes)
        run: |
          sleep 1800 
          echo "Wait finished or was interrupted."
        shell: bash 


      - name: Upload workspace directory
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.run_id }}
          path: .
